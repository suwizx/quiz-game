# ทับค่าจาก docker-compose.yml สำหรับเครื่อง production ที่อยู่หลัง Cloudflare Tunnel
#
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
#
# เปิดออกเน็ตแค่ web (พอร์ต 3080 บน loopback) — tunnel ชี้มาที่พอร์ตนี้พอร์ตเดียว
# ส่วน /api และ /ws ให้ nginx ใน container web proxy ต่อไปที่ server เอง
services:
  web:
    build:
      args:
        VITE_SERVER_URL: https://quiz.suwizx.dev
    ports: !override
      - "127.0.0.1:3080:80"

  server:
    # ไม่ publish ออกโฮสต์ — เครื่องนี้มีบริการอื่นใช้ 3000 อยู่แล้ว
    ports: !override []
    environment:
      NODE_ENV: production
      CORS_ORIGIN: https://quiz.suwizx.dev
      BETTER_AUTH_URL: https://quiz.suwizx.dev
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD ใน .env}@postgres:5432/singpore-game

  postgres:
    ports: !override []
